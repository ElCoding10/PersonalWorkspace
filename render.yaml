services:
  - type: web
    name: personal-assistant
    runtime: node
    buildCommand: corepack enable && corepack prepare npm@10.9.2 --activate && npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/workbench.sqlite
    disk:
      name: workbench-data
      mountPath: /var/data
      sizeGB: 1