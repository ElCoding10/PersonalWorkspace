services:
  - type: web
    name: personal-assistant
    runtime: node
    buildCommand: corepack npm ci --include=dev && corepack npm run build
    startCommand: corepack npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/workbench.sqlite
    disk:
      name: workbench-data
      mountPath: /var/data
      sizeGB: 1